name: Validate

on:
  push:
  pull_request:

jobs:
  package:
    name: Package validation
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Validate package
        run: python scripts/validate-package.py
